name: DWiM CI Pipeline

# Trigger on changes to dev AND your feature branch
on:
  push:
    branches: [ dev, 'feat/**' ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Run MATLAB Tests
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Install MATLAB on the runner
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      # Step 3: Run the tests
      # We use "." as source-folder so MATLAB sees the "+dwim" package correctly
      - name: Run Unit Tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: .
          select-by-folder: tests
          test-results-junit: test-results/results.xml
          strict: true